<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ProApp Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>

<body>

<header class="header">
  <div class="logo">ProApp</div>
  <button id="menuToggle" class="menu-btn">☰</button>
</header>

<div class="app-container">

  <aside class="sidebar" id="sidebar">
    <nav>
      <ul>
        <li class="active">Dashboard</li>
        <li>Users</li>
        <li>Reports</li>
        <li>Settings</li>
        <li>Gallery</li>
      </ul>
    </nav>
  </aside>

  <main class="main">
    <section class="cards">
      <div class="card">Users<br><strong>1200</strong></div>
      <div class="card">Revenue<br><strong>$45K</strong></div>
      <div class="card">Errors<br><strong>12</strong></div>
      <div class="card">Sessions<br><strong>3.2K</strong></div>
    </section>

    <section class="table-section">
      <h2>User List</h2>
      <table id="userTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Role</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
